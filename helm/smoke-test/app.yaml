apiVersion: v1
kind: Namespace
metadata:
  name: smoke-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smoke-nginx
  namespace: smoke-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smoke-nginx
  template:
    metadata:
      labels:
        app: smoke-nginx
    spec:
      containers:
        - name: nginx
          image: nginxdemos/hello:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: smoke-nginx
  namespace: smoke-test
spec:
  selector:
    app: smoke-nginx
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smoke-nginx
  namespace: smoke-test
  annotations:
    cert-manager.io/cluster-issuer: step-ca-acme
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - smoke.tekton-lab.test
      secretName: smoke-tls
  rules:
    - host: smoke.tekton-lab.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: smoke-nginx
                port:
                  number: 80
