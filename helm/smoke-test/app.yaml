apiVersion: v1
kind: Namespace
metadata:
  name: smoke-test
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smoke-nginx
  namespace: smoke-test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smoke-nginx
  template:
    metadata:
      labels:
        app: smoke-nginx
    spec:
      containers:
        - name: nginx
          image: nginxdemos/hello:latest
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: smoke-nginx
  namespace: smoke-test
spec:
  selector:
    app: smoke-nginx
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: smoke-nginx
  namespace: smoke-test
spec:
  parentRefs:
    - name: lab-gateway
      namespace: lab-gateway
      sectionName: https-smoke
  hostnames:
    - smoke.tekton-lab.test
  rules:
    - backendRefs:
        - name: smoke-nginx
          port: 80
