apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: step-ca-acme
spec:
  acme:
    server: https://{{ .Values.stepcaHost }}:{{ .Values.stepcaPort }}/acme/acme/directory
    caBundle: {{ .Values.stepcaRootCaB64 }}
    privateKeySecretRef:
      name: step-ca-acme-account-key
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - name: lab-gateway
                namespace: lab-gateway
                kind: Gateway
