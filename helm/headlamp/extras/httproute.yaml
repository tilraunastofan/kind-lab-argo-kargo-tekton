apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: headlamp
  namespace: headlamp
spec:
  parentRefs:
    - name: lab-gateway
      namespace: lab-gateway
      sectionName: https-headlamp
  hostnames:
    - headlamp.tekton-lab.test
  rules:
    - backendRefs:
        - name: headlamp
          port: 80
