apiVersion: v1
kind: Namespace
metadata:
  name: dns-utils
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dnsmasq-config
  namespace: dns-utils
data:
  dnsmasq.conf: |
    no-resolv
    address=/tekton-lab.test/{{ .Values.gatewayIP }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dnsmasq
  namespace: dns-utils
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dnsmasq
  template:
    metadata:
      labels:
        app: dnsmasq
      annotations:
        checksum/config: {{ .Values.configChecksum | quote }}
    spec:
      containers:
        - name: dnsmasq
          image: dockurr/dnsmasq:2.93
          args: ["-C", "/etc/dnsmasq.conf", "-k"]
          ports:
            - containerPort: 53
              protocol: UDP
            - containerPort: 53
              protocol: TCP
          volumeMounts:
            - name: config
              mountPath: /etc/dnsmasq.conf
              subPath: dnsmasq.conf
      volumes:
        - name: config
          configMap:
            name: dnsmasq-config
---
apiVersion: v1
kind: Service
metadata:
  name: dnsmasq
  namespace: dns-utils
spec:
  type: NodePort
  selector:
    app: dnsmasq
  ports:
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
      nodePort: 30053
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
      nodePort: 30053
