listeners:
  - name: smoke
    hostname: smoke.tekton-lab.test
    certificateRef: smoke-tls
  - name: argocd
    hostname: argocd.tekton-lab.test
    certificateRef: argocd-tls
  - name: headlamp
    hostname: headlamp.tekton-lab.test
    certificateRef: headlamp-tls
  # certificateRef here must match the Certificate's spec.secretName in
  # helm/event-generator/extras/certificate.yaml — cert-manager writes the
  # issued cert into a Secret by that name, and this Gateway listener's TLS
  # termination reads it back out by the same name.
  - name: event-generator
    hostname: event-generator.tekton-lab.test
    certificateRef: event-generator-tls
  - name: event-generator-dev
    hostname: event-generator-dev.tekton-lab.test
    certificateRef: event-generator-dev-tls
  - name: pipelines-as-code
    hostname: pipelines-as-code.tekton-lab.test
    certificateRef: pipelines-as-code-tls
