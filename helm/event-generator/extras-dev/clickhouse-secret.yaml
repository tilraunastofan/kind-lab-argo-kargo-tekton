# helm/event-generator/extras-dev/clickhouse-secret.yaml
#
# NOT in the Task 4 brief's file list — added because, without it, the
# event-generator Deployment in demo-app-dev can't start at all
# (CreateContainerConfigError: secret "clickhouse-admin-password" not
# found), discovered live during Step 9/11 verification. Kubernetes
# Secrets are namespace-scoped and a Pod's secretKeyRef can only read a
# Secret in its own namespace — helm/clickhouse/templates/secret.yaml
# only creates clickhouse-admin-password in demo-app (see that file's
# comment for why it's a fixed, committed value rather than
# chart-generated), so demo-app-dev needs its own copy of the same value
# to reach the shared ClickHouse instance the brief calls for. Value
# mirrors helm/clickhouse/values.yaml's committed adminPassword.
apiVersion: v1
kind: Secret
metadata:
  name: clickhouse-admin-password
  namespace: demo-app-dev
type: Opaque
stringData:
  password: kind-lab-clickhouse-demo
