# helm/kargo/values.yaml
#
# api.secret.name points the chart at the kargo-admin Secret
# scripts/kargo-admin-up.sh creates, rather than inlining a bcrypt
# password hash into this Git-committed file (the chart's own values.yaml
# documents this as the escape hatch for "the Secret will not be
# generated by Helm").
#
# api.tls.enabled: false + api.host below match this repo's existing
# ArgoCD pattern (helm/argocd/values.yaml's server.insecure: true): the
# API server serves plain HTTP on its Service (port 80, see the chart's
# templates/api/service.yaml), and ingress-nginx + cert-manager terminate
# real TLS in front of it via helm/kargo/extras/ingress.yaml — the same
# division of labor as every other app in this repo, rather than using
# the chart's own built-in Ingress/self-signed-cert support
# (api.ingress.*), which would produce an untrusted cert.
api:
  secret:
    name: kargo-admin
  host: kargo.tekton-lab.test
  tls:
    enabled: false
