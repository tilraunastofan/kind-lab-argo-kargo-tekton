# helm/datadog-agent/templates/datadogagent.yaml
#
# The DatadogAgent custom resource: this is the entire interface between
# "I want infra metrics in Datadog" and the Operator actually doing it.
# Once ArgoCD applies this, the Operator's controller notices it and
# creates a Node Agent DaemonSet (one pod per node, collects host/container
# metrics) and a Cluster Agent Deployment (aggregates cluster-level state
# like pod counts and Kubernetes events) — this repo declares none of
# those resources directly, the Operator owns creating and updating them.
apiVersion: datadoghq.com/v2alpha1
kind: DatadogAgent
metadata:
  name: {{ .Values.name }}
  namespace: datadog
spec:
  global:
    site: {{ .Values.site | quote }}
    clusterName: {{ .Values.clusterName | quote }}
    credentials:
      apiSecret:
        secretName: {{ .Values.credentialsSecretName | quote }}
        keyName: {{ .Values.credentialsSecretKey | quote }}
    # See the comment on values.yaml's kubeletTlsVerify: kind's kubelet
    # serving cert isn't signed by anything the Agent's default CA bundle
    # trusts, so without this the Agent can't reach the kubelet at all and
    # crash-loops unable to determine its own hostname.
    kubelet:
      tlsVerify: {{ .Values.kubeletTlsVerify }}
  features:
    # Live Process collection. Same effect as setting
    # DD_PROCESS_CONFIG_PROCESS_COLLECTION_ENABLED=true plus mounting the
    # host's /etc/passwd read-only into the Agent (for user names): the
    # Operator adds both to the Node Agent itself, so neither is declared here.
    liveProcessCollection:
      enabled: {{ .Values.liveProcessCollection }}
    # Log collection with Autodiscovery. With containerCollectAll false, only
    # pods carrying an `ad.datadoghq.com/<container>.logs` annotation are
    # collected (opt-in, keeps log volume/cost down); true collects every
    # container's stdout/stderr. The Operator mounts the node's pod log
    # directory into the Agent itself.
    logCollection:
      enabled: {{ .Values.logCollection.enabled }}
      containerCollectAll: {{ .Values.logCollection.containerCollectAll }}
    # APM trace intake. Go apps send spans themselves (dd-trace-go); the
    # Operator's single-step auto-instrumentation does not cover Go, so
    # features.apm.instrumentation is deliberately not enabled. The Agent
    # listens on hostPort 8126 so a pod can reach its own node's Agent at
    # $(status.hostIP):8126.
    apm:
      enabled: {{ .Values.apm.enabled }}
      hostPortConfig:
        enabled: true
        hostPort: 8126
