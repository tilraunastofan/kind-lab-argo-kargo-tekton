kubeProxyReplacement: false
nodePort:
  enabled: true
gatewayAPI:
  enabled: true
ipam:
  mode: kubernetes
operator:
  replicas: 1
# The chart's default is prometheus.enabled: false for the agent (the
# operator's own metrics are on by default, port 9963 — only the agent's
# are off). Datadog's Kubernetes Autodiscovery recognizes the cilium/cilium
# image automatically and tries to scrape the agent's default metrics port
# (9962) regardless of whether it's actually serving anything, which
# without this was failing with "Connection refused" in the Agent's logs.
prometheus:
  enabled: true
