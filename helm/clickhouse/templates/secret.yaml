# helm/clickhouse/templates/secret.yaml
#
# We own this Secret outright (rather than letting a chart auto-generate
# one, as bitnami's did) specifically so its value is deterministic across
# every ArgoCD sync — ArgoCD renders Helm charts via `helm template`, with
# no live-cluster access, so any chart-side "reuse the existing Secret's
# value" mechanism (which needs a `lookup()` call) silently can't run and
# mints a fresh random value on every single reconciliation instead. That
# exact failure mode broke event-generator's ClickHouse connection during
# this sub-project's first live deploy attempt with the bitnami chart.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.name }}-admin-password
  namespace: demo-app
type: Opaque
stringData:
  password: {{ .Values.adminPassword | quote }}
