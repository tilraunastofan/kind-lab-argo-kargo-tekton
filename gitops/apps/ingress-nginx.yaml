# gitops/apps/ingress-nginx.yaml
#
# Installs ingress-nginx (https://kubernetes.github.io/ingress-nginx) —
# this lab's replacement for Cilium's Gateway API implementation. Plain
# Ingress resources instead of Gateway API's Gateway/HTTPRoute objects,
# on purpose: it fully decouples the CNI (kindnet, cluster/kind-config.yaml)
# from the ingress/TLS layer again, and it's the more widely-known
# building block for a lab whose point is demoing Tekton/ArgoCD/Kargo,
# not ingress internals.
#
# Early sync-wave ("-2"), same tier as clickhouse-operator/tekton-pipelines
# (gitops/apps/clickhouse-operator.yaml, gitops/apps/tekton-pipelines.yaml):
# cert-manager's ClusterIssuer (helm/cluster-issuer) needs a working
# `nginx` IngressClass to solve ACME HTTP-01 challenges through, and every
# app below depends on the controller Pod being up — bootstrap.sh's own
# wait_for blocks on its Deployment rollout.
#
# hostPort + nodeSelector/toleration (instead of `service.type:
# LoadBalancer`) is kind's own documented plugin-free ingress pattern
# (https://kind.sigs.k8s.io/docs/user/ingress/): the controller Pod is
# pinned to the control-plane node (the one carrying the `ingress-ready`
# label and the extraPortMappings in cluster/kind-config.yaml) and binds
# host ports 80/443 directly, so no cloud LoadBalancer implementation —
# and no host-level daemon like cloud-provider-kind — is needed at all.
# This also means this same values block is portable to a real cluster
# later without changes: a LoadBalancer-capable cluster can simply
# override `controller.service.type` back to `LoadBalancer` there.
#
# targetRevision pinned to 4.15.1 (chart version, app version 1.15.1) —
# the latest published release as of this repo's rewrite; the original
# design doc's 4.11.3 is no longer available in the chart repo's index.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-nginx
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  project: default
  source:
    repoURL: https://kubernetes.github.io/ingress-nginx
    chart: ingress-nginx
    targetRevision: 4.15.1
    helm:
      values: |
        controller:
          hostPort:
            enabled: true
          service:
            type: NodePort
          nodeSelector:
            ingress-ready: "true"
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Equal
              effect: NoSchedule
          admissionWebhooks:
            # Disabled: this webhook only validates Ingress syntax before
            # admission (e.g. catching a malformed annotation) — a nice-to-
            # have, not something this lab depends on. It's also a known
            # bad combination with ArgoCD's hook lifecycle: the webhook's
            # cert-generating "create" Job is a PreSync hook that ArgoCD
            # prunes on success (hook-succeeded policy), but the Secret it
            # creates carries an ownerReference back to that same Job, so
            # Kubernetes' garbage collector cascades and deletes the Secret
            # the instant ArgoCD deletes the Job — right before the
            # PostSync "patch" Job needs it. selfHeal then retries forever,
            # regenerating and re-losing the Secret every cycle without
            # ever reaching a stable Synced state. Disabling the webhook
            # sidesteps the whole hook-Job/ownerReference interaction.
            enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: ingress-nginx
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
