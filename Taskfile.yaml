version: "3"

tasks:
  cluster:up:
    desc: Bootstrap the full tekton-lab cluster (step-ca, kind, ingress-nginx, cert-manager, DNS, smoke test)
    cmds:
      - ./bootstrap.sh

  cluster:down:
    desc: Tear down the kind-lab cluster
    cmds:
      - ./scripts/cluster-down.sh

  cluster:status:
    desc: Quick health check of the cluster
    cmds:
      - ./scripts/cluster-status.sh

  status:
    desc: Print the overall status of the lab (nodes, ArgoCD apps, pods, certs, endpoints, host services)
    cmds:
      - ./scripts/lab-status.sh

  smoke:test:
    desc: Re-run just the smoke-test verification
    cmds:
      - ./scripts/smoke-test.sh

  logs-db:up:
    desc: Start/repair the host ClickHouse container that stores cluster logs (needs the kind network)
    cmds:
      - ./scripts/clickhouse-logs-up.sh

  logs-db:down:
    desc: Remove the clickhouse-logs container (keeps its data volume; use logs-db:purge to delete data)
    cmds:
      - docker rm -f clickhouse-logs

  logs-db:purge:
    desc: DELETE all stored logs — removes the clickhouse-logs container and its data volume
    cmds:
      - docker rm -f clickhouse-logs
      - docker volume rm clickhouse-logs-data
